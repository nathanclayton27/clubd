name: check
# The safety nets that caught this week's bugs, run on every push:
# the build must succeed, the committed index.html/manifest must match a
# fresh build (a stale manifest means someone forgot to rebuild), the tree
# must be self-consistent (no manifest entry without its JSON — the class
# of miss that once 404'd seven live pages), and the content linter must
# come back clean beyond the known order ties. The wiki parser's pins run
# here too: four rounds of fixes each added tests nothing on push executed.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: python src/build.py
      - name: Committed build is current
        # l/ is covered by status, not diff: a share page the build wrote for
        # a new list is untracked, and diff cannot see it
        run: |
          git diff --exit-code -- index.html properties/index.json l \
            && [ -z "$(git status --porcelain -- l)" ] \
            || { echo "::error::index.html/manifest/l are stale — run src/build.py and commit the result"; exit 1; }
      - name: Content lint + tree consistency
        run: python tools/qa_lint.py
      # CLU-510. Every list carries a genre or names the clause exempting it.
      # Here rather than nowhere because the tagging pass is 185 judgement
      # calls made once, and the only thing that can undo it is a new list
      # arriving with no line in the table — which nobody would notice.
      - name: Every list has a genre
        run: python tools/genrecheck.py
      # CLU-552. Most of properties/ is generated, so a field hand-edited onto
      # a property file survives only until the next run of its generator, which
      # rewrites the file from its own dict and drops it — silently, with a green
      # build. `mega: true` was committed onto five property files and emitted by
      # none of the five generators; every rebuild dropped those lists off the
      # home page's mega row. This regenerates every generator-owned list into a
      # temp tree and compares. Exit 2 is "no new problem, but incomplete" —
      # recorded debt, or a generator whose source is not in a committed cache
      # and so cannot run with no network — and passes with a warning; exit 1 is
      # drift nothing accounts for.
      - name: Generated property files match their generators
        run: |
          set +e
          python tools/gendrift.py
          rc=$?
          set -e
          if [ "$rc" = "2" ]; then
            echo "::warning::gendrift ran incomplete — see UNCHECKED and RECORDED DEBT above"
            exit 0
          fi
          exit $rc
      # CLU-430. A row id is the `item_id` every tick and every thumb is stored
      # against, in the database and in every browser's localStorage, and ids
      # fold from titles. The folds disagree about what an apostrophe is: some
      # keep a straight one as a dash and DROP a curly one, others drop the
      # straight one and would DASH a curly one. So a title edit as small as
      # curling an apostrophe can rename an id, and a renamed id is a silent,
      # unrecoverable untick of that row for everyone who had it, on every
      # device. Nothing fails, nothing logs, and nobody finds out.
      #
      # This proves, per generator, that the function which demonstrably built
      # a row's id is blind to the character. It found eleven folds that could
      # move an id the day their list was touched. Here rather than nowhere
      # because the eleven were a one-off and a new list is not: the next
      # generator to arrive with a fold that drops what it should dash would
      # otherwise be found by whoever happened to run this by hand.
      - name: No generator's fold can move a row id
        run: python tools/idsafe.py
      # The wiki parser's pins. Four rounds of fixes each added tests that
      # nothing on push executed, so a regression could only be found by
      # whoever next ran the file by hand.
      - name: Wiki parser pins
        run: python tools/test_wiki_parser.py

  # Blocks any commit that carries something shaped like a credential.
  # Config in .gitleaks.toml: defaults plus an allowlist for the public
  # Supabase publishable key.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
